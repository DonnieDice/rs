[workspace]
resolver = "2"
members = [
    "crates/protondrive-core",
    "crates/protondrive-crypto",
    "crates/protondrive-api",
    "crates/protondrive-auth",
    "crates/protondrive-events",
    "crates/protondrive-sdk",
    "crates/protondrive-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["DonnieDice"]
repository = "https://github.com/DonnieDice/rs"

[workspace.dependencies]
# Internal crates
protondrive-core    = { path = "crates/protondrive-core" }
protondrive-crypto  = { path = "crates/protondrive-crypto", default-features = false }
protondrive-api     = { path = "crates/protondrive-api" }
protondrive-auth    = { path = "crates/protondrive-auth" }
protondrive-events  = { path = "crates/protondrive-events" }
protondrive-sdk     = { path = "crates/protondrive-sdk" }

# Proton foundation crates
proton-crypto         = { version = "0.12.1", default-features = false }
proton-crypto-account = { version = "0.18.1", default-features = false }
proton-srp            = { version = "0.8.2" }

# Async runtime
tokio  = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
futures = { version = "0.3" }

# HTTP
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
reqwest_cookie_store = { version = "0.8" }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }
serde_urlencoded = { version = "0.7" }
sha2 = { version = "0.10" }

# Secrets / zeroing
secrecy  = { version = "0.10", features = ["serde"] }
zeroize  = { version = "1", features = ["derive"] }

# TOTP
totp-rs = { version = "5" }

# Bytes / IO
bytes        = { version = "1" }
tokio-util   = { version = "0.7", features = ["io", "codec"] }

# Errors
thiserror = { version = "1" }
anyhow    = { version = "1" }

# Tracing
tracing = { version = "0.1" }

# Retry / backoff
backon = { version = "0.4" }

# Subtle (constant-time)
subtle = { version = "2" }

# Misc
url  = { version = "2" }
uuid = { version = "1", features = ["v4", "serde"] }

# Dev / test
wiremock = { version = "0.6" }
proptest = { version = "1" }
tokio-test = { version = "0.4" }

[workspace.metadata.cargo-deny]
# see deny.toml

[profile.release]
lto           = true
codegen-units = 1
strip         = "debuginfo"

[profile.dev]
debug = true
