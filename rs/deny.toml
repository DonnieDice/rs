[graph]
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "GPL-3.0",
    "LGPL-2.1",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
]
deny = ["AGPL-3.0"]
copyleft = "allow"
allow-osi-fsf-free = "neither"
default = "deny"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
